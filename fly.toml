app = 'petmate-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[env]
  NODE_ENV = 'production'
  PORT = '3000'

# 部署后请通过 flyctl secrets set JWT_SECRET=your_strong_secret 设置密钥
